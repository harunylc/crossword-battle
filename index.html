<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CrosswordBattle</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4f6fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Fill the window instead of Unity's default fixed-size box, so the game is responsive
         and CanvasScaler actually sees the real viewport. */
      #unity-container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #f4f6fa;
        /* Stop mobile browsers hijacking drags as page scrolls/zooms — the game is drag-driven. */
        touch-action: none;
      }
      #unity-loading {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: #5b6472;
        font-size: 16px;
        text-align: center;
      }
      #unity-progress-track {
        width: 220px;
        height: 6px;
        margin: 12px auto 0;
        background: #e2e6ee;
        border-radius: 3px;
        overflow: hidden;
      }
      #unity-progress-fill {
        width: 0%;
        height: 100%;
        background: #2f6bff;
        border-radius: 3px;
        transition: width .15s ease-out;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        padding: 10px 14px;
        background: #fff3cd;
        color: #664d03;
        border-radius: 8px;
        font-size: 14px;
        display: none;
        max-width: 80%;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        CrosswordBattle
        <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var progressFill = document.querySelector("#unity-progress-fill");
      var warningBox = document.querySelector("#unity-warning");

      function showBanner(msg, type) {
        warningBox.style.display = "block";
        warningBox.innerHTML = msg;
        if (type === "error") warningBox.style.background = "#f8d7da";
      }

      var config = {
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "CrosswordBattle",
        productVersion: "1.0.0",
        showBanner: showBanner,
        // Keep the drawing buffer matched to the CSS size so resizing the window re-lays out the UI.
        matchWebGLToCanvasSize: true,
        devicePixelRatio: window.devicePixelRatio || 1
      };

      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressFill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
