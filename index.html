<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossword Battle — Google Play'de</title>
<meta name="description" content="Crossword Battle: iki kişilik Türkçe kare bulmaca düellosu. Google Play'de ücretsiz.">

<!-- The store listing points at this domain, so the card the link previews has to be right. -->
<meta property="og:title" content="Crossword Battle">
<meta property="og:description" content="İki kişilik Türkçe kare bulmaca düellosu. Google Play'de ücretsiz.">
<meta property="og:type" content="website">

<style>
/* Colours are UiTheme's Dark palette, so the page looks like the thing it is advertising. */
:root{
  --page:#14171C; --deep:#0C0E12; --surface:#1D222A; --rim:rgba(255,255,255,.16);
  --ink:#E8ECF1; --dim:#8B95A2; --accent:#5C8CFF; --accent-ink:#0E1420; --tile:#C39A45;
  --sans:ui-sans-serif,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--sans); color:var(--ink); line-height:1.6;
  background:
    radial-gradient(620px 460px at 22% 18%, rgba(92,140,255,.30), transparent 70%),
    radial-gradient(520px 420px at 82% 74%, rgba(240,122,144,.22), transparent 70%),
    radial-gradient(460px 380px at 50% 104%, rgba(195,154,69,.22), transparent 70%),
    linear-gradient(var(--page), var(--deep));
  background-attachment:fixed;
  display:grid; place-items:center; padding:32px 20px;
}
main{
  max-width:520px; width:100%; text-align:center;
  background:rgba(29,34,42,.78); border:1px solid var(--rim); border-radius:26px;
  padding:44px 30px 34px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 60px -22px rgba(0,0,0,.6);
}
.mark{
  width:76px; height:76px; margin:0 auto 20px; border-radius:20px; background:var(--accent);
  display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:13px;
}
.mark i{background:rgba(14,20,32,.5); border-radius:3px}
.mark i:nth-child(2n){background:var(--tile)}
h1{font-size:clamp(28px,6vw,38px); margin:0 0 10px; letter-spacing:-.02em}
p.lede{color:var(--dim); margin:0 auto 28px; max-width:34ch}
.store{
  display:inline-flex; align-items:center; gap:10px; text-decoration:none; font-weight:650;
  background:var(--accent); color:var(--accent-ink); padding:15px 30px; border-radius:999px;
  font-size:17px; transition:transform .12s ease;
}
a.store:hover{transform:translateY(-1px)}
/* The pre-launch state: same shape so the page does not reflow on the day, but visibly not a button. */
.store.soon{background:transparent; color:var(--dim); border:1px solid var(--rim); cursor:default}
a.store:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.foot{margin:30px 0 0; font-size:13.5px; color:var(--dim)}
.foot a{color:var(--dim)}
.en{margin:22px 0 0; font-size:13.5px; color:var(--dim)}
@media (prefers-reduced-motion:reduce){.store{transition:none}}
</style>
</head>
<body>

<main>
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <h1>Crossword Battle</h1>
  <p class="lede">İki kişilik Türkçe kare bulmaca düellosu. Sıra sende, sıra onda — kelimeyi kim
    tamamlarsa puanı o alır.</p>

  <!-- ON LAUNCH DAY: delete the <span> and uncomment the <a>. Nothing else on this page changes.
       The link is already correct — it is derived from the package name — but it 404s until the
       listing is published, and a dead store button is worse than an honest "soon". -->
  <span class="store soon" aria-disabled="true">Yakında Google Play'de</span>
  <!--
  <a class="store" href="https://play.google.com/store/apps/details?id=com.harunylc.crosswordbattle">
    Google Play'den indir
  </a>
  -->

  <p class="en">Coming soon to Google Play — a two-player Turkish crossword duel.</p>

  <p class="foot">
    <a href="/crossword-battle/gizlilik/">Gizlilik politikası</a>
  </p>
</main>

</body>
</html>
